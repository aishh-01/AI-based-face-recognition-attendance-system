<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
        
    }
    .container {
        width: 100%;
        margin: auto;
        
        padding: 20px;
        box-shadow: 0px 0px 10px gray;
        
    }
    
    h1 {
        color: #333;
    }
    
    .form-container {
        margin-top: 20px;
    }
    
    input, select {
        width: 80%;
        padding: 10px;
        margin: 10px 0;
    }
    
    button {
        padding: 10px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
    }
    
    button:hover {
        background: darkblue;
    }
    
    </style>    
</head>
<body>

    <div class="container">

        <!-- Add Student -->
        <div class="form-container">
            <h2>Add Student</h2>
            <form id="studentForm" enctype="multipart/form-data">
                <input type="text" id="studentName" placeholder="Student Name" required>
                <input type="text" id="studentID" placeholder="Student ID" required>
                <input type="text" id="studentCourse" placeholder="Course" required>
                <input type="text" id="studentStream" placeholder="Stream">
                <input type="email" id="studentEmail" placeholder="Email" required>
                <input type="password" id="studentPassword" placeholder="Password" required><br>
                <label for="studentPhoto">Upload Photo:</label>
                <input type="file" id="studentPhoto" accept="image/*" required>
                <button type="submit">Add Student</button>
            </form>
        </div>


<!-- View Registered Students -->
<div class="form-container">
    <h2>View Registered Students</h2>
    <label for="studentCourseSelect">Select Course:</label>
    <select id="studentCourseSelect">
        <option value="">--Select--</option>
        <option value="BTech">BTech</option>
        <option value="BCA">BCA</option>
        <option value="MTech">MTech</option>
    </select>
    <button onclick="redirectTo('students')">View Students</button>
</div>
    </div>

    <script>
        

        // Add Student
        document.getElementById("studentForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append("name", document.getElementById("studentName").value);
            formData.append("studentID", document.getElementById("studentID").value);
            formData.append("course", document.getElementById("studentCourse").value);
            formData.append("stream", document.getElementById("studentStream").value);
            formData.append("email", document.getElementById("studentEmail").value);
            formData.append("password", document.getElementById("studentPassword").value);
            formData.append("photo", document.getElementById("studentPhoto").files[0]);

            try {
                const response = await fetch("http://localhost:5000/api/addStudent", {
                    method: "POST",
                    body: formData,
                });

                const result = await response.json();
        if (response.ok) {
            alert(result.message);
        } else {
            alert(result.error || "Something went wrong!");
        }
    } catch (error) {
        console.error("Fetch error:", error);  // ✅ Use this
        alert("Error adding student. Please try again.");
    }

        });
 
       
    function redirectTo(type) {
        const course = type === "faculty"
            ? document.getElementById("facultyCourseSelect").value
            : document.getElementById("studentCourseSelect").value;
        
        if (!course) {
            alert("Please select a course.");
            return;
        }
        
        // Redirect to a new page with query parameters
        window.location.href = `view.html?type=${type}&course=${course}`;
    }


    </script>
</body>
</html>
