<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Registration</title>
    
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
        
    }
    .container {
        width: 100%;
        margin: auto;
        padding: 20px;
        
        
    }
    
    h1 {
        color: #333;
    }
    
    .form-container {
        margin-top: 20px;
    }
    
    input, select {
        width: 80%;
        padding: 10px;
        margin: 10px 0;
    }
    
    button {
        padding: 10px;
        background: blue;
        color: white;
        border: none;
        cursor: pointer;
    }
    
    button:hover {
        background: darkblue;
    }
    
    </style>    
</head>
<body>

    <div class="container">
            
        <!-- Add Faculty -->
        <div class="form-container">
            <h2>Add Faculty</h2>
            <form id="facultyForm">
                <input type="text" id="facultyName" placeholder="Faculty Name" required>
                <input type="text" id="facultyID" placeholder="Faculty ID" required>
                <input type="email" id="facultyEmail" placeholder="Email" required>
                <input type="password" id="facultyPassword" placeholder="Password" required><br>
                <label for="facultyPhoto">Upload Photo:</label>
                <input type="file" id="facultyPhoto" accept="image/*" required>
                <button type="submit">Add Faculty</button>
            </form>
        </div>

        

        <!-- Update Faculty Assignments -->
        <div class="form-container">
            <h2>Assign/Update Faculty Courses</h2>
            <form id="updateFacultyForm">
                <input type="text" id="updateFacultyID" placeholder="Faculty ID" required><br>

                
                <input type="text" id="facultyCourse" placeholder="Course (e.g., BTech,BCA)"><br>
                <input type="text" id="facultyStream" placeholder="Stream (e.g., CSE, IT)"><br>
                <input type="number" id="facultyYear" placeholder="Year (e.g., 1,2,3)" required>
                <input type="number" id="facultySemester" placeholder="Semester (e.g., 3)" required><br>
                <input type="text" id="facultySubjects" placeholder="Subject1, Subject2"><br>
                <button type="submit">Update Assignments</button>
            </form>
        </div>
        <!-- View Registered Faculty -->
<div class="form-container">
    <h2>View Registered Faculty</h2>
    <label for="facultyCourseSelect">Select Course:</label>
    <select id="facultyCourseSelect">
        <option value="">--Select--</option>
        <option value="BTech">BTech</option>
        <option value="BCA">BCA</option>
        <option value="MTech">MTech</option>
    </select>
    <button onclick="redirectTo('faculty')">View Faculty</button>
</div>

    <script>
        // Add Faculty
        document.getElementById("facultyForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData();
            formData.append("name", document.getElementById("facultyName").value);
            formData.append("facultyID", document.getElementById("facultyID").value);
            formData.append("email", document.getElementById("facultyEmail").value);
            formData.append("password", document.getElementById("facultyPassword").value);
            formData.append("photo", document.getElementById("facultyPhoto").files[0]);

            try {
                const response = await fetch("http://localhost:5000/api/addFaculty", {
                    method: "POST",
                    body: formData,
                });

                const result = await response.json();
                alert(result.message);
            } catch (error) {
                console.error("Error adding faculty:", error);
                alert("Error adding faculty.");
            }
        });


        // Update Faculty Assignments
        document.getElementById("updateFacultyForm").addEventListener("submit", async function (event) {
            event.preventDefault();
    
            const facultyID = document.getElementById("updateFacultyID").value;
            const course = document.getElementById("facultyCourse").value;
            const stream = document.getElementById("facultyStream").value;
            const year = document.getElementById("facultyYear").value;
            const semester = document.getElementById("facultySemester").value;
            const subjects = document.getElementById("facultySubjects").value.split(",").map(subject => subject.trim());
    
            try {
                const response = await fetch(`http://localhost:5000/api/updateFacultyAssignments/${facultyID}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                assignments: [{ course, stream, year, semester, subjects }]
            })
        });

    
                const result = await response.json();
                alert(result.message);
            } catch (error) {
                console.error("Error updating assignments:", error);
                alert("Error updating faculty assignments.");
            }
        });
       
    function redirectTo(type) {
        const course = type === "faculty"
            ? document.getElementById("facultyCourseSelect").value
            : document.getElementById("studentCourseSelect").value;
        
        if (!course) {
            alert("Please select a course.");
            return;
        }
        
        // Redirect to a new page with query parameters
        window.location.href = `view.html?type=${type}&course=${course}`;
    }


    </script>
</body>
</html>
